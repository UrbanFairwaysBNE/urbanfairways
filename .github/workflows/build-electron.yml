name: Build Windows Installer
# Build v3

on:
  push:
    branches: [main]
    paths:
      - 'electron/**'
      - 'src/pages/BayController.tsx'
      - 'src/bay-controller-main.tsx'
      - 'bay-controller.html'
      - 'vite.config.electron.ts'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build TAPO control executable
        working-directory: ./electron
        run: |
          pip install pyinstaller tapo
          pyinstaller --onefile --distpath . --workpath build_temp --specpath build_temp --clean --noconfirm tapo_control.py
          Remove-Item -Recurse -Force build_temp -ErrorAction SilentlyContinue

      - name: Set sequential bay controller version
        id: set_version
        working-directory: ./electron
        run: |
          node -e "
            const fs = require('fs');

            (async () => {
              const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
              const [major, minor, localPatch] = pkg.version.split('.').map((n) => Number(n) || 0);

              let latestPatch = localPatch;
              try {
                const response = await fetch('https://github.com/UrbanFairwaysBNE/UF-Bay-Controller/releases/latest/download/latest.yml', {
                  headers: { 'Cache-Control': 'no-cache' }
                });

                if (response.ok) {
                  const latestYml = await response.text();
                  const match = latestYml.match(/version:\s*(\d+)\.(\d+)\.(\d+)/);
                  if (match) {
                    const latestMajor = Number(match[1]);
                    const latestMinor = Number(match[2]);
                    const latestPatchFromRelease = Number(match[3]);
                    if (latestMajor === major && latestMinor === minor) {
                      latestPatch = latestPatchFromRelease;
                    }
                  }
                }
              } catch (err) {
                console.log('Could not read latest release version, falling back to local package version');
              }

              const nextPatch = Math.max(localPatch, latestPatch) + 1;
              pkg.version = [major, minor, nextPatch].join('.');

              fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
              fs.appendFileSync(process.env.GITHUB_OUTPUT, 'new_version=' + pkg.version + '\n');
              console.log('Set version to ' + pkg.version + ' (latest release patch: ' + latestPatch + ')');
            })().catch((error) => {
              console.error('Version step failed:', error);
              process.exit(1);
            });
          "

      - name: Install web app dependencies
        run: npm install --no-audit --no-fund

      - name: Build bay controller app
        run: npx vite build --config vite.config.electron.ts

      - name: Install Electron dependencies
        working-directory: ./electron
        run: npm install

      - name: Build Windows installer
        working-directory: ./electron
        run: npx electron-builder --publish never

      - name: Resolve updater asset path
        id: resolve_updater_asset
        shell: pwsh
        run: |
          $latestYml = "electron/dist-electron/latest.yml"
          if (!(Test-Path $latestYml)) { throw "latest.yml not found at $latestYml" }

          $pathLine = Select-String -Path $latestYml -Pattern '^path:\s*(.+)$'
          if (!$pathLine) { throw "Could not find 'path:' in latest.yml" }

          $expectedName = $pathLine.Matches[0].Groups[1].Value.Trim()
          $expectedPath = "electron/dist-electron/$expectedName"

          if (!(Test-Path $expectedPath)) {
            $exe = Get-ChildItem "electron/dist-electron" -Filter "*.exe" |
              Sort-Object LastWriteTime -Descending |
              Select-Object -First 1

            if (!$exe) { throw "No .exe file found in electron/dist-electron" }

            Copy-Item $exe.FullName $expectedPath
            Write-Host "Copied $($exe.Name) -> $expectedName"
          }

          "asset_path=$expectedPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: UrbanFairwaysBayController-Windows
          path: |
            ${{ steps.resolve_updater_asset.outputs.asset_path }}
            electron/dist-electron/latest.yml
          retention-days: 3

      - name: Create Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.set_version.outputs.new_version }}
          name: UF Bay Controller ${{ steps.set_version.outputs.new_version }}
          files: |
            ${{ steps.resolve_updater_asset.outputs.asset_path }}
            electron/dist-electron/latest.yml
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
